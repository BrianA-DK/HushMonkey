<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Reboot HushMonkey system</title>

<style>
    body {
        font-family: verdana, sans-serif;
        background: #111;
        color: #fff;
        text-align: center;
        padding-top: 50px;
		margin: 0;
		height: 100vh;
		display: grid;
		place-items: center; /* centrerer indhold */
		background-color: #222;
		
    }
	
	.container {
		display: grid;
		width: 60vw; /* 80% af viewport width */
		/*height: 95vh; /* valgfri højde */
	  }
	  

	.frame {
		border: 5px solid white;
		background-color: #444;
	}

    h1 {
        color: white;
		font-family: verdana, sans-serif;
		text-align: center;
		font-size: clamp(20px, 5vmin, 1800px);
		font-weight: 800;
    }	
</style>
</head>

<body>
	<div class="container"><div class="frame">
		<h1>Reboot HushMonkey System</h1>
		<div id="loader">
		</div>

	</div>

<script>
	const base = `${window.location.protocol}//${window.location.host}`;
	const healthUrl = `${base}/health`;
	const redirectUrl = base;
	const requiredStreak = 3;
	const maxAttemptsPhase1 = 20;
	const maxAttemptsPhase2 = 60;
	const timeoutMs = 5000;
	const pause = 1000;
	let attempt = 0;
	let streak = 0;
	let maxAttempts = maxAttemptsPhase1;
	const loader = document.getElementById("loader");

	// PROGRESS BAR anim
	function animateBar(durationMs, color = "#00d4ff") {
		const bar = document.getElementById("bar");
		if (!bar) return;
		bar.style.background = color;
		let start = null;
		function step(ts) {
			if (!start) start = ts;
			const progress = ts - start;
			const percent = Math.min((progress / durationMs) * 100, 100);
			bar.style.width = percent + "%";
			if (progress < durationMs) {
				requestAnimationFrame(step);
			}
		}
		requestAnimationFrame(step);
	}

	// UI
	function render(message, color = "#00d4ff", seconds = 1) {
		loader.innerHTML = `
			<p>${message}</p>
			<div style="width:80%;background:#333;border:1px solid #666;overflow:hidden;margin:0 auto;">
				<div id="bar" style="
					width:0%;
					height:20px;
					background:${color};
				"></div>
			</div>
			<p>Attempt: ${attempt}/${maxAttempts}</p>
		`;
		animateBar(seconds * 1000, color);
	}

	// HEALTH CHECK
	async function checkHealth() {
		const controller = new AbortController();
		const timeout = setTimeout(() => controller.abort(), timeoutMs);
		try {
			const res = await fetch(healthUrl, {
				cache: "no-store",
				signal: controller.signal
			});
			clearTimeout(timeout);
			if (!res.ok) return false;
			const data = await res.json();
			return data?.status === "ok";
		} catch {
			clearTimeout(timeout);
			return false;
		}
	}

	// PHASE 1: WAIT FOR DOWN
	async function waitForRestart() {
		attempt = 0;
		maxAttempts = maxAttemptsPhase1;
		render("😒 Waiting for reboot...", "#00d4ff");
		while (attempt < maxAttemptsPhase1) {
			attempt++;
			const ok = await checkHealth();
			if (!ok) {
				render("🟡 Down down down", "#ffcc00");
				return true;
			}
			render("🤪 Waiting for reboot", "#00d4ff");
			await new Promise(r => setTimeout(r, pause));
		}
		render("💀 Timeout waiting for reboot. Trying to reload mainpage...", "#ff4444");
		setTimeout(() => {
			window.location.href = redirectUrl;
		}, 1600);
		return false;
	}

	// PHASE 2: WAIT FOR STABLE
	async function waitForStableBoot() {
		attempt = 0;
		maxAttempts = maxAttemptsPhase2;
		render("Waiting for server to come back up", "#00d4ff");
		while (attempt < maxAttemptsPhase2) {
			attempt++;
			const ok = await checkHealth();
			if (ok) {
				streak++;
			} else {
				streak = 0;
			}
			render(
				ok ? "✔ Verifying connection (" + streak + "/" + requiredStreak + ")" : "❓ Waiting for monkey to return",
				ok ? "#00ff88" : "#ff4444"
			);
			if (streak >= requiredStreak) {
				render("🍌 HushMonkey running — reloading main page", "#00ff88");
				setTimeout(() => {
					window.location.href = redirectUrl;
				}, 1600);
				return;
			}
			await new Promise(r => setTimeout(r, pause));
		}
		render("❌ Try reload mainpage manually or powercycle server if error persists.", "#ff4444");
	}

	// MAIN
	async function start() {
		if (await waitForRestart()) { await waitForStableBoot(); }
	}
	start();
</script>

</body>
</html>
