<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>HushMonkey - Setup</title>

<style>
    body {
        font-family: verdana, sans-serif;
        background: #111;
        color: #fff;
        text-align: center;
        padding-top: 50px;
		margin: 0;
		height: 100vh;
		display: grid;
		place-items: center; /* centrerer indhold */
		background-color: #222;
		
    }
	
	.container {
		display: grid;
		width: 60vw; /* 80% af viewport width */
		/*height: 95vh; /* valgfri højde */
	  }
	  

	.frame {
		border: 5px solid white;
		background-color: #444;
	}
	
	.frame + .frame {
		border-top: none;
	}

    h1 {
        color: white;
		font-family: verdana, sans-serif;
		text-align: center;
		font-size: clamp(20px, 4vmin, 1800px);
		font-weight: 800;
    }

    .limits {
        font-size: clamp(16px, 3vmin, 1800px);
		font-weight: 500;
        
        transition: 0.2s;
    }
	
	.limits_small {
        font-size: clamp(12px, 3vmin, 1800px);
		font-weight: 500;
        margin: 20px 0;
        color: #00d4ff;
        transition: 0.2s;
    }

    button {
        display: block;
        width: clamp(150px, 40vmin, 400px);
        margin: 10px auto;
        padding: 15px;
        font-size: clamp(16px, 2vmin, 1800px);
		font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #2c7be5;
        color: white;
        transition: 0.2s;
    }

    button:hover:not(:disabled) {
        background: #1a5fc1;
    }

    button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    #ReturnBtn {
        background: #e5533d;
    }

    #ReturnBtn:hover:not(:disabled) {
        background: #c13d2b;
    }

    #SaveBtn {
        background: #00a86b;
    }

    #SaveBtn:hover:not(:disabled) {
        background: #007a4f;
    }
	
	#BlueBtn {
        background: #2c7be5;
    }

    #BlueBtn:hover:not(:disabled) {
        background: #1a5fc1;
    }

    #status {
        margin-top: 20px;
        font-size: clamp(16px, 2vmin, 1800px);
		font-weight: 600;
        color: #aaa;
    }

   form {
        display: grid;
        grid-template-columns: 25vw 10vw auto; /* label | input */
        gap: 8px 12px; /* afstand mellem rækker og kolonner */
        align-items: center;
    }

    label.limits {
        text-align: right;
        padding-right: 6px;
    }

    input.limits {
        width: 9vw;
    }
	
	.status {
		
		padding-left: 4px;
		text-align: left; /* venstrejustering */
	}
	
	.button-row {
		display: flex;
		justify-content: center;
		gap: 12px;
		flex-wrap: wrap;
		margin-top: 20px;
	}

	/* base button style */
		.sys-btn {
		flex: 1;
		min-width: 160px;
		max-width: 220px;

		padding: 15px;
		font-size: clamp(14px, 2vmin, 18px);
		font-weight: 600;

		border: none;
		border-radius: 8px;
		cursor: pointer;

		color: white;
		transition: 0.2s;
	}

	/* COLORS */
	.sys-btn.safe {
		background: #2c7be5;
	}

	.sys-btn.safe:hover {
		background: #1a5fc1;
	}

	.sys-btn.warn {
		background: #f0ad4e;
	}

	.sys-btn.warn:hover {
		background: #d8922f;
	}

	.sys-btn.danger {
		background: #e5533d;
	}

	.sys-btn.danger:hover {
		background: #c13d2b;
	}

	/* click feel */
	button:active {
		transform: scale(0.97);
	}

	
	/* ===== MODAL ===== */
	#modal-overlay {
		position: fixed;
		inset: 0;
		background: rgba(0,0,0,0.5);
		z-index: 9999;

		display: flex;
		align-items: center;
		justify-content: center;
	}

	#modal-overlay.hidden {
		display: none;
	}

	.modal-box {
		background: white;
		padding: 20px;
		border-radius: 5px;
		min-width: 40%;
		max-width: 65%;
		border: 3px solid black;
	}

	.modal-buttons {
		margin-top: 20px;
		display: flex;
		justify-content: flex-end;
		gap: 10px;
	}
	
</style>
</head>

<body>
	<div id="modal-overlay" class="hidden">
        <div class="modal-box">
            <div id="modal-content"></div>
            <div id="modal-buttons" class="modal-buttons"></div>
        </div>
    </div>
	
	<div class="container">
		<div class="frame">
			<h1>LAF limits</h1>

			<form>
				<label class="limits" for="laf">LAF</label>
				<input class="limits" type="text" id="laf" name="laf2" value="-100.0">
				<span class="status" id="statuslaf"></span>

				<label class="limits" for="laeq1">LAeq 1 min</label>
				<input class="limits" type="text" id="laeq1" name="laeq12" value="-200.0">
				<span class="status" id="status-laeq1"></span>

				<label class="limits" for="laeq10">LAeq 10 min</label>
				<input class="limits" type="text" id="laeq10" name="laeq102" value="-300.0">
				<span class="status" id="status-laeq10"></span>
				
				<label class="limits" for="delay">Alert delay</label>
				<input class="limits" type="number" id="alert_delay" name="alert_delay" value="8" min="2" max="20">
				<span class="status" id="status-alert_delay"></span>
				
			</form> 

			<p>
				<button id="SaveBtn" onclick="SaveLimits()" disabled>Save limits</button>
				<button id="ReturnBtn"  onclick="GotoMain()" >Return to main page</button>
			</p>
			</br>
		</div>
		<div class="frame">
		<h1>System</h1>
		<div class="button-row">
			<button class="sys-btn safe" onclick="restart()">Restart app</button>
			<button class="sys-btn warn" onclick="reboot()">Reboot sys</button>
			<button class="sys-btn danger" onclick="shutdown()">Shutdown sys</button>
		</div>
		</div>
	</div>

	<script>
		// MODAL SYSTEM

		const overlay = document.getElementById("modal-overlay");
		const contentDiv = document.getElementById("modal-content");
		const buttonsDiv = document.getElementById("modal-buttons");
		const modalBox = document.querySelector(".modal-box");

		let modalResolve = null;

		function closeModal(value) {
			overlay.classList.add("hidden");
			modalBox.style.background = "";
			modalBox.style.color = "";

			if (modalResolve) {
				modalResolve(value);
				modalResolve = null;
			}
		}

		function validHex(c) {
			return typeof c === "string" && /^#[0-9A-Fa-f]{6}$/.test(c);
		}

		// ESC key (single global listener)
		document.addEventListener("keydown", (e) => {
			if (e.key === "Escape" && !overlay.classList.contains("hidden")) {
				closeModal(false);
			}
		});

		// Click outside (single global listener)
		overlay.addEventListener("click", (e) => {
			if (e.target === overlay) closeModal(false);
		});

		// Generic MODAL
		function showModal(contentHTML, buttons = [], bgColor = null, textColor = null) {
			return new Promise((resolve) => {
				modalResolve = resolve;

				contentDiv.innerHTML = contentHTML;

				modalBox.style.background = validHex(bgColor) ? bgColor : "#ffffff";
				modalBox.style.color = validHex(textColor) ? textColor : "#000000";

				buttonsDiv.innerHTML = "";
				buttons.forEach((btn, i) => {
					const b = document.createElement("button");
					b.textContent = btn.text;
					b.classList.add("modal-btn");

					if (i === 0) setTimeout(() => b.focus(), 10);

					b.onclick = () => closeModal(btn.value);
					buttonsDiv.appendChild(b);
				});

				overlay.classList.remove("hidden");
			});
		}

		// ALERT
		function customAlert(message, bgColor = null, textColor = null) {
			return showModal(`<p>${message}</p>`, [
				{ text: "OK", value: true }
			], bgColor, textColor);
		}

		// CONFIRM
		function customConfirm(message, bgColor = null, textColor = null) {
			return showModal(`<p>${message}</p>`, [
				{ text: "Cancel", value: false },
				{ text: "OK", value: true }
			], bgColor, textColor);
		}



		// LIMIT PAGE LOGIC

		let saved = true;
		let LAFlimit = "";
		let LAEQ1limit = "";
		let LAEQ10limit = "";
		let alert_delay = 0;

		// Cache inputs
		const lafInput = document.getElementById("laf");
		const laeq1Input = document.getElementById("laeq1");
		const laeq10Input = document.getElementById("laeq10");
		const alertDelayInput = document.getElementById("alert_delay");

		const statusLAF = document.getElementById("statuslaf");
		const status1 = document.getElementById("status-laeq1");
		const status10 = document.getElementById("status-laeq10");
		const statusDelay = document.getElementById("status-alert_delay");

		const saveBtn = document.getElementById("SaveBtn");


		// Load old limits
		async function get_old_limits() {
			try {
				const res = await fetch('/data');
				if (!res.ok) throw new Error(`GET failed: ${res.status}`);
				const d = await res.json();

				LAFlimit = d.LAF_limit.toFixed(1);
				LAEQ1limit = d.LAeq1_limit.toFixed(1);
				LAEQ10limit = d.LAeq10_limit.toFixed(1);
				alert_delay = d.alert_delay;

				lafInput.value = LAFlimit;
				laeq1Input.value = LAEQ1limit;
				laeq10Input.value = LAEQ10limit;
				alertDelayInput.value = alert_delay;

			} catch (err) {
				console.error("Error in get_old_limits:", err);
			}
		}

		// Detect changes
		function changed() {
			let chg = 0;
			let err = 0;

			// Clamp alert_delay BEFORE validation
			let delayVal = parseFloat(alertDelayInput.value);
			if (delayVal < 2) delayVal = 2;
			if (delayVal > 20) delayVal = 20;
			alertDelayInput.value = delayVal;

			function checkField(oldVal, inputElem, statusElem) {
				const val = inputElem.value;

				// Validate number
				if (isNaN(val)) {
					err++;
					statusElem.innerText = "Must be a number!";
					return;
				}

				// Compare rounded values
				if (Number(oldVal).toFixed(1) !== Number(val).toFixed(1)) {
					chg++;
					statusElem.innerText = "Old value was " + oldVal;
				} else {
					statusElem.innerText = "";
				}
			}

			checkField(LAFlimit, lafInput, statusLAF);
			checkField(LAEQ1limit, laeq1Input, status1);
			checkField(LAEQ10limit, laeq10Input, status10);
			checkField(alert_delay, alertDelayInput, statusDelay);

			saveBtn.disabled = !(chg > 0 && err === 0);
			saved = chg === 0;
		}



		// Disable buttons
		function setButtonsDisabled(disabled) {
			["SaveBtn", "ReturnBtn"].forEach(id => {
				document.getElementById(id).disabled = disabled;
			});
		}



		// Navigation
		async function GotoMain() {
			if (saved) {
				window.location.href = "/";
			} else {
				const txt = "<h1>⚠️Limits changed</h1>You are about to leave without saving?</br></br>";
				const answ = await showModal(`<p>${txt}</p>`, [
					{ text: "Discard and goto main page", value: false },
					{ text: "Cancel", value: true }
				], "#aa0000", "#ffffff");

				if (answ !== true) {
					window.location.href = "/";
				}
			}
		}

		// Save limits
		async function SaveLimits() {
			try {
				const r = await fetch('/limits', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						LAF_limit: parseFloat(lafInput.value),
						LAeq1_limit: parseFloat(laeq1Input.value),
						LAeq10_limit: parseFloat(laeq10Input.value),
						alert_delay: parseFloat(alertDelayInput.value)
					})
				});

				if (!r.ok) throw new Error(`POST failed: ${r.status}`);

				await get_old_limits();
				saved = true;

				// SUCCESS ALERT (your request)
				customAlert("Limits saved successfully", "#3A843D", "#ffffff");

			} catch (err) {
				console.error("Error in SaveLimits:", err);
			}
		}



		// Restart / Reboot / Shutdown
		async function restart() {
			try {
				const answ = await customConfirm("<h1>🙊 Restart HushMonkey?</h1>", "#aa0000", "#ffffff");
				if (answ === true) {
					const res = await fetch('/restart');
					if (!res.ok) throw new Error(`GET failed: ${res.status}`);
					const d = await res.json();
					console.log("Restart return: " + d.status);
					window.location.href = "/restart.html";
				}
			} catch (err) {
				console.error("Error in restart:", err);
			}
		}

		async function reboot() {
			try {
				const answ = await customConfirm("<h1>🙈 Reboot system?</h1>", "#aa0000", "#ffffff");
				if (answ === true) {
					const res = await fetch('/reboot');
					if (!res.ok) throw new Error(`GET failed: ${res.status}`);
					const d = await res.json();
					console.log("Reboot return: " + d.status);
					window.location.href = "/reboot.html";
				}
			} catch (err) {
				console.error("Error in reboot:", err);
			}
		}

		async function shutdown() {
			try {
				const answ = await customConfirm("<h1>🦍 Shutdown system?</h1>", "#aa0000", "#ffffff");
				if (answ === true) {
					const res = await fetch('/shutdown');
					if (!res.ok) throw new Error(`GET failed: ${res.status}`);
					const d = await res.json();
					console.log("Shutdown return: " + d.status);
					window.location.href = "/shutdown.html";
				}
			} catch (err) {
				console.error("Error in shutdown:", err);
			}
		}

		// Init
		get_old_limits();
		setInterval(changed, 100);

	</script>

	</body>
</html>
