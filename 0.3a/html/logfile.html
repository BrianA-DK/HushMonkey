<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Log View via SocketIO</title>
    
    <!-- Socket.io klient-biblioteket -->
    <script src="js/socket.io.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111111;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 80%;
            margin: 0 auto;
        }
        .head {
			font-size: 24px;
			font-weight: 700;
            color: #3c52b4;
        }
		.sub {
            color: #6679cc;
        }
        .log-container {
			
            width: 100%;
            height: 70vh;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: scroll; /* Tillader manuel scroll op/ned */
            border-radius: 6px;
			margin: 10px;
			border: 2px solid #4d4d4d;
            
            white-space: pre-wrap; /* Bevarer linjeskift og formatering */
            word-break: break-all;
        }
        .log-entry {
            margin-bottom: 4px;
            border-bottom: 0px solid #2d2d2d;
            padding-bottom: 0px;
            line-height: 1.0;
        }
        .status-msg {
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="head">System Log: /var/log/hushmonkey.log</span><br>
		<span class ="sub">(Live view, starting with the last 1000 lines)</span>
		<br><br>

        
        <!-- Selve log-vinduet -->
        <div id="log-window" class="log-container">Forbinder til server...</div>
    </div>

    <script>
        const logWindow = document.getElementById('log-window');
        
        // Initialiser SocketIO (forbinder automatisk til samme host/port)
        const socket = io(); 

        // 1. Når vi forbinder til SocketIO, beder vi om at "joine" det specifikke log-rum
        socket.on('connect', () => {
            logWindow.innerHTML = '<div class="status-msg" style="color: #4caf50;">[Forbundet. Henter live log...]</div>';
            socket.emit('join_log_stream');
        });

        // 2. Modtag og vis nye log-linjer i realtid
        socket.on('new_log_line', function(msg) {
            // Tjek om brugeren er scrollet op for at læse gammel historik.
            // Hvis afstanden til bunden er under 50px, betragter vi brugeren som værende "i bunden".
            const isUserAtBottom = logWindow.scrollHeight - logWindow.clientHeight <= logWindow.scrollTop + 50;

            // Opret og tilføj den nye linje
            const newEntry = document.createElement('div');
            newEntry.className = 'log-entry';
            newEntry.textContent = msg.data;
            logWindow.appendChild(newEntry);

            // Rul automatisk til bunden, MEDMINDRE brugeren aktivt har scrollet op
            if (isUserAtBottom) {
                logWindow.scrollTop = logWindow.scrollHeight;
            }
        });

        // 3. Håndtering af forbindelsesfejl/disconnect
        socket.on('disconnect', () => {
            const errorEntry = document.createElement('div');
            errorEntry.className = 'log-entry status-msg';
            errorEntry.style.color = '#ff6b6b';
            errorEntry.textContent = "[Forbindelse afbrudt - forsøger at genforbinde...]";
            logWindow.appendChild(errorEntry);
        });

        // 4. Hvis brugeren lukker fanen eller genindlæser, sender vi et hurtigt signal
        // til backenden, så den kan lukke for log-watcheren med det samme.
        window.addEventListener('beforeunload', () => {
            socket.emit('leave_log_stream');
        });

        // TIP: Hvis du indbygger dette i et Single Page Application (SPA) setup, 
        // hvor brugeren kan navigere væk fra komponenten uden at lukke browseren,
        // skal du blot kalde `socket.emit('leave_log_stream');` når komponenten "unmountes".
    </script>
</body>
</html>
