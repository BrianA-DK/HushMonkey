<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Spectrum Analyzer</title>

    <!-- Offline Chart.js -->
    <script src="chart.min.js"></script>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: verdana, sans-serif;
        }
		
        #chart-container {
            width: 95%;
            height: 80vh;
            margin: auto;
        }
		
		.switch {
			position: relative;
			display: inline-block;
			width: clamp(30px, 6vmin, 60px);
			height: clamp(17px, 3.4vmin, 34px);
			margin-bottom: 5px;
		}

		.switch input {
			opacity: 0;
			width: 0;
			height: 0;
		}

		.slider {
			position: absolute;
			cursor: pointer;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #555;
			transition: .4s;
			border-radius: 34px;
		}

		.slider:before {
			position: absolute;
			content: "";
			height: clamp(8px, 2.6vmin, 26px);
			width: clamp(8px, 2.6vmin, 26px);
			left: clamp(1px, 0.4vmin, 4px);
			bottom: clamp(2px, 0.4vmin, 4px);
			background-color: white;
			transition: .4s;
			border-radius: 50%;
		}

		input:checked + .slider {
			background-color: #0a84ff;
		}

		input:checked + .slider:before {
			transform: translateX(clamp(8px, 2.6vmin, 26px));
		}
		
		.btn-2 {
			color: #fff;
			background-color: #6c757d;
			border-color: #6c757d;
			/*display: inline-block;*/
			text-align: center;
			text-decoration: none;
			vertical-align: middle;
			cursor: pointer;
			user-select: none;
			padding: 3px 25px;
			font-size: clamp(12px, 2vmin, 1800px);
			border-radius: .80rem;
			border: none;
			font-weight: bold;
			letter-spacing: 1.2px;
			font-family: verdana, sans-serif;
		}

		.btn-2:hover {
			color: #fff;
			background-color: #5c636a;
		}

		.btn-2:active {
			box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.24);
		}
		
		/* click feel */
		button:active {
			transform: scale(0.97);
		}
		
		.spechead { 
			color: white;
			font-family: verdana, sans-serif;
			text-align: center;
			font-size: clamp(12px, 5vmin, 1800px);
			font-weight: 800;
		}
		
		.floater_left {
			position: absolute;
			z-index: 3;
			top: 5px;
			left: 5px;
		}
		.floater_right {
			position: absolute;
			z-index: 3;
			top: 5px;
			right: 5px;
		}
		
		.text {
			font-size: clamp(12px, 2vmin, 1800px);
		}
			
    </style>
</head>
<body>

<p class ="spechead" style="position: relative; top: clamp(-30px, -3vmin, -10px);">1/3‑Octave Spectrum</p>
<div class="floater_left">
	<button   class="btn-2" role="button" onclick="toggle_fullscreen()">Toggle</br>Fullscreen</button>
</div>
<div class=floater_right>
	<button   class="btn-2" role="button" onclick="location.href='/'">Return to<br>LAF meter</button>
</div>
<div style="margin-top: clamp(-90px, -5.5vmin, -5px);;">
	<span style="margin-left: 10px; " class="text">Reset Peaks</span>
	<label class="switch">
		<input onclick="triggerReset()" type="checkbox" id="resetToggle">
		<span class="slider"></span>
	</label>

	<span style="margin-left: 50px;" class="text">Decay speed</span>
	<label class="switch">
		<input type="checkbox" id="peakToggle" onclick="togglePeakMode()">
		<span class="slider"></span>
	</label>
	<span id="peakModeLabel" style="margin-left: 10px;" class="text">Slow</span>

	<span style="margin-left: 50px;" class="text">Y-axis</span>
	<label class="switch">
		<input type="checkbox" id="yaxisToggle" onclick="toggleYAxisMode()">
		<span class="slider"></span>
	</label>
	<span id="yaxisModeLabel" style="margin-left: 10px;" class="text">Wide</span>
</div>

<div id="chart-container">
    <canvas id="spectrumChart"></canvas>
</div>

	<script>
		const ctx = document.getElementById("spectrumChart").getContext("2d");
		const resetToggle = document.getElementById("resetToggle");
		const peakModeLabel = document.getElementById("peakModeLabel");
		const peakToggle = document.getElementById("peakToggle");
		const yaxisModeLabel = document.getElementById("yaxisModeLabel");
		const yaxisToggle = document.getElementById("yaxisToggle");
		const elem = document.documentElement;

		let spectrumChart = new Chart(ctx, {
			type: "bar",
			data: {
				labels: [],
				datasets: [
					{
						label: "Level (dB SPL)",
						data: [],
						backgroundColor: "rgba(0, 150, 255, 0.6)",
						borderColor: "rgba(0, 150, 255, 1)",
						borderWidth: 1
					},
					{
						label: "Peak Hold",
						type: "line",
						data: [],
						borderColor: "yellow",
						borderWidth: 2,
						pointRadius: 0,
						fill: false,
						tension: 0.2
					}
				]
			},
			options: {
				responsive: true,
				scales: {
					y: {
						min: 40,
						max: 120,
						title: {
							display: true,
							text: "dB SPL"
						},
						grid: {
							color: "#444"
						}
					},
					x: {
						grid: {
							color: "#333"
						}
					}
				},
				plugins: {
					legend: {
						labels: {
							color: "#eee"
						}
					}
				}
			}
		});

		function releaseReset() {
			setTimeout(() => {
				resetToggle.checked = false;
			}, 180);
		}

		async function triggerReset() {
			console.log("triggerReset CALLED");
			resetToggle.checked = true;

			try {
				const res = await fetch("/reset_peaks");
				if (!res.ok) throw new Error(`Reset failed: ${res.status}`);
				console.log("fetch RESET OK");
			} catch (err) {
				console.error("fetch error", err);
			}

			releaseReset();
		}

		async function updateSpectrum() {
			try {
				const response = await fetch("/spectrum_data");
				if (!response.ok) throw new Error(`Spectrum fetch failed: ${response.status}`);

				const data = await response.json();

				if (!Array.isArray(data.freqs) || !Array.isArray(data.levels)) {
					console.warn("Spectrum data malformed:", data);
					return;
				}

				spectrumChart.data.labels = data.freqs.map(f => f.toString());
				spectrumChart.data.datasets[0].data = data.levels;

				if (Array.isArray(data.peak)) {
					spectrumChart.data.datasets[1].data = data.peak;
				}

				spectrumChart.update();
			} catch (e) {
				console.log("Spectrum fetch error:", e);
			}
		}

		async function togglePeakMode() {
			try {
				const res = await fetch("/toggle_peak_mode");
				if (!res.ok) throw new Error(`GET failed: ${res.status}`);

				const mode = await res.text();

				peakModeLabel.innerText = mode.charAt(0).toUpperCase() + mode.slice(1);
				peakToggle.checked = (mode === "fast");
			} catch (err) {
				console.error("Error in togglePeakMode:", err);
			}
		}

		async function toggleYAxisMode() {
			try {
				const res = await fetch("/toggle_yaxis_mode");
				if (!res.ok) throw new Error(`GET failed: ${res.status}`);

				const mode = await res.text();

				yaxisModeLabel.innerText = mode.charAt(0).toUpperCase() + mode.slice(1);
				yaxisToggle.checked = (mode === "narrow");

				if (mode === "narrow") {
					spectrumChart.options.scales.y.min = 0;
					spectrumChart.options.scales.y.max = 60;
				} else {
					spectrumChart.options.scales.y.min = 40;
					spectrumChart.options.scales.y.max = 120;
				}

				spectrumChart.update();
			} catch (err) {
				console.error("Error in toggleYAxisMode:", err);
			}
		}

		function openFullscreen() {
			if (elem.requestFullscreen) {
				elem.requestFullscreen();
			} else if (elem.webkitRequestFullscreen) {
				elem.webkitRequestFullscreen();
			} else if (elem.msRequestFullscreen) {
				elem.msRequestFullscreen();
			}
		}

		function closeFullscreen() {
			if (document.exitFullscreen) {
				document.exitFullscreen();
			} else if (document.webkitExitFullscreen) {
				document.webkitExitFullscreen();
			} else if (document.msExitFullscreen) {
				document.msExitFullscreen();
			}
		}

		function toggle_fullscreen() {
			if (!document.fullscreenElement &&
				!document.webkitFullscreenElement &&
				!document.msFullscreenElement) {
				openFullscreen();
			} else {
				closeFullscreen();
			}
		}

		async function GetModesFromServer() {
			try {
				const res = await fetch("/get_modes");
				if (!res.ok) throw new Error("Failed to load modes");

				const data = await res.json();
				console.log("Modes from server:", data);

				// --- Peak mode ---
				const peakMode = data.peakmode;   // "fast" eller "slow"
				peakToggle.checked = (peakMode === "fast");
				peakModeLabel.innerText = peakMode.charAt(0).toUpperCase() + peakMode.slice(1);

				// --- Y-axis mode ---
				const yMode = data.ymode;         // "wide" eller "narrow"
				yaxisToggle.checked = (yMode === "narrow");
				yaxisModeLabel.innerText = yMode.charAt(0).toUpperCase() + yMode.slice(1);

				if (yMode === "narrow") {
					spectrumChart.options.scales.y.min = 0;
					spectrumChart.options.scales.y.max = 60;
				} else {
					spectrumChart.options.scales.y.min = 40;
					spectrumChart.options.scales.y.max = 120;
				}

				spectrumChart.update();

			} catch (err) {
				console.error("Error loading initial modes:", err);
			}
		}

		window.addEventListener("DOMContentLoaded", GetModesFromServer); // sync UI states from server at page load
		setInterval(updateSpectrum, 300); // update spectrum every 300ms
		setInterval(GetModesFromServer, 1000); // Poll server every second to sync UI state

	</script>

</body>
</html>
