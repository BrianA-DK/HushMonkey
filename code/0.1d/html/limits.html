<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Hush Monkey - Setup</title>

<style>
    body {
        font-family: verdana, sans-serif;
        background: #111;
        color: #fff;
        text-align: center;
        padding-top: 50px;
		margin: 0;
		height: 100vh;
		display: grid;
		place-items: center; /* centrerer indhold */
		background-color: #222;
		
    }
	
	.container {
		display: grid;
		width: 60vw; /* 80% af viewport width */
		/*height: 95vh; /* valgfri højde */
	  }
	  

	.frame {
		border: 5px solid white;
		background-color: #444;
	}
	
	.frame + .frame {
		border-top: none;
	}

    h1 {
        color: white;
		font-family: verdana, sans-serif;
		text-align: center;
		font-size: clamp(20px, 4vmin, 1800px);
		font-weight: 800;
    }

    .limits {
        font-size: clamp(16px, 3vmin, 1800px);
		font-weight: 500;
        
        transition: 0.2s;
    }
	
	.limits_small {
        font-size: clamp(12px, 3vmin, 1800px);
		font-weight: 500;
        margin: 20px 0;
        color: #00d4ff;
        transition: 0.2s;
    }

    button {
        display: block;
        width: clamp(150px, 40vmin, 400px);
        margin: 10px auto;
        padding: 15px;
        font-size: clamp(16px, 2vmin, 1800px);
		font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #2c7be5;
        color: white;
        transition: 0.2s;
    }

    button:hover:not(:disabled) {
        background: #1a5fc1;
    }

    button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    #ReturnBtn {
        background: #e5533d;
    }

    #ReturnBtn:hover:not(:disabled) {
        background: #c13d2b;
    }

    #SaveBtn {
        background: #00a86b;
    }

    #SaveBtn:hover:not(:disabled) {
        background: #007a4f;
    }
	
	#BlueBtn {
        background: #2c7be5;
    }

    #BlueBtn:hover:not(:disabled) {
        background: #1a5fc1;
    }

    #status {
        margin-top: 20px;
        font-size: clamp(16px, 2vmin, 1800px);
		font-weight: 600;
        color: #aaa;
    }

   form {
        display: grid;
        grid-template-columns: 25vw 10vw auto; /* label | input */
        gap: 8px 12px; /* afstand mellem rækker og kolonner */
        align-items: center;
    }

    label.limits {
        text-align: right;
        padding-right: 6px;
    }

    input.limits {
        width: 9vw;
    }
	
	.status {
		
		padding-left: 4px;
		text-align: left; /* venstrejustering */
	}
	
	.button-row {
		display: flex;
		justify-content: center;
		gap: 12px;
		flex-wrap: wrap;
		margin-top: 20px;
	}

	/* base button style */
		.sys-btn {
		flex: 1;
		min-width: 160px;
		max-width: 220px;

		padding: 15px;
		font-size: clamp(14px, 2vmin, 18px);
		font-weight: 600;

		border: none;
		border-radius: 8px;
		cursor: pointer;

		color: white;
		transition: 0.2s;
	}

	/* COLORS */
	.sys-btn.safe {
		background: #2c7be5;
	}

	.sys-btn.safe:hover {
		background: #1a5fc1;
	}

	.sys-btn.warn {
		background: #f0ad4e;
	}

	.sys-btn.warn:hover {
		background: #d8922f;
	}

	.sys-btn.danger {
		background: #e5533d;
	}

	.sys-btn.danger:hover {
		background: #c13d2b;
	}

	/* click feel */
	button:active {
		transform: scale(0.97);
	}

	
	/* ===== MODAL ===== */
	#modal-overlay {
		position: fixed;
		inset: 0;
		background: rgba(0,0,0,0.5);
		z-index: 9999;

		display: flex;
		align-items: center;
		justify-content: center;
	}

	#modal-overlay.hidden {
		display: none;
	}

	.modal-box {
		background: white;
		padding: 20px;
		border-radius: 5px;
		min-width: 40%;
		max-width: 65%;
		border: 3px solid black;
	}

	.modal-buttons {
		margin-top: 20px;
		display: flex;
		justify-content: flex-end;
		gap: 10px;
	}
	
</style>
</head>

<body>
	<div id="modal-overlay" class="hidden">
        <div class="modal-box">
            <div id="modal-content"></div>
            <div id="modal-buttons" class="modal-buttons"></div>
        </div>
    </div>
	
	<div class="container">
		<div class="frame">
			<h1>LAF limits</h1>

			<form>
				<label class="limits" for="laf">LAF</label>
				<input class="limits" type="text" id="laf" name="laf2" value="-100.0">
				<span class="status" id="statuslaf"></span>

				<label class="limits" for="laeq1">LAeq 1 min</label>
				<input class="limits" type="text" id="laeq1" name="laeq12" value="-200.0">
				<span class="status" id="status-laeq1"></span>

				<label class="limits" for="laeq10">LAeq 10 min</label>
				<input class="limits" type="text" id="laeq10" name="laeq102" value="-300.0">
				<span class="status" id="status-laeq10"></span>
				
				<label class="limits" for="delay">Alert delay</label>
				<input class="limits" type="number" id="alert_delay" name="alert_delay" value="8" min="2" max="20">
				<span class="status" id="status-alert_delay"></span>
				
			</form> 

			<p>
				<button id="SaveBtn" onclick="SaveLimits()" disabled>Save limits</button>
				<button id="ReturnBtn"  onclick="GotoMain()" >Return to main page</button>
			</p>
			</br>
		</div>
		<div class="frame">
		<h1>System</h1>
		<div class="button-row">
			<button class="sys-btn safe" onclick="restart()">Restart app</button>
			<button class="sys-btn warn" onclick="reboot()">Reboot sys</button>
			<button class="sys-btn danger" onclick="shutdown()">Shutdown sys</button>
		</div>
		</div>
	</div>

	<script>
		const overlay = document.getElementById("modal-overlay");
		const contentDiv = document.getElementById("modal-content");
		const buttonsDiv = document.getElementById("modal-buttons");
		const mod = document.getElementById("modal-box");

		const CAL_WAIT_SECONDS = 5;
		let running = false;
		let progressInterval = null;
		let saved = true;
		let LAFlimit = "";
		let LAEQ1limit = "";
		let LAEQ10limit = "";
		let alert_delay = 0;

		// Close modal
		function closeModal() {
			overlay.classList.add("hidden");
			document.removeEventListener("keydown", escHandler);
		}

		// ESC key
		function escHandler(e) {
			if (e.key === "Escape") {
				closeModal();
			}
		}

		// Click outside
		overlay.addEventListener("click", (e) => {
			if (e.target === overlay) {
				closeModal();
			}
		});

		// Generic MODAL
		function showModal(content, buttons = [], bgColor = null, textColor = null) {
			return new Promise((resolve) => {
				contentDiv.innerHTML = content;
				buttonsDiv.innerHTML = "";

				const modalBox = document.querySelector(".modal-box");
				if (typeof bgColor === "string" && /^#[0-9A-Fa-f]{6}$/.test(bgColor)) {
					modalBox.style.background = bgColor;
				} else {
					modalBox.style.background = "white";
				}

				if (typeof textColor === "string" && /^#[0-9A-Fa-f]{6}$/.test(textColor)) {
					modalBox.style.color = textColor;
				} else {
					modalBox.style.color = "black";
				}

				buttons.forEach(btn => {
					const button = document.createElement("button");
					button.textContent = btn.text;
					button.onclick = () => {
						closeModal();
						resolve(btn.value);
					};
					buttonsDiv.appendChild(button);
				});

				overlay.classList.remove("hidden");
				document.addEventListener("keydown", escHandler);
			});
		}

		// ALERT
		function customAlert(message, bgColor = null, textColor = null) {
			return showModal(`<p>${message}</p>`, [
				{ text: "OK", value: true }
			], bgColor, textColor);
		}

		// CONFIRM
		function customConfirm(message, bgColor = null, textColor = null) {
			return showModal(`<p>${message}</p>`, [
				{ text: "Cancel", value: false },
				{ text: "OK", value: true }
			], bgColor, textColor);
		}

		async function get_old_limits() {
			try {
				const res = await fetch('/data');
				if (!res.ok) throw new Error(`GET failed: ${res.status}`);
				const d = await res.json();
				LAFlimit = d.LAF_limit.toFixed(1);
				LAEQ1limit = d.LAeq1_limit.toFixed(1);
				LAEQ10limit = d.LAeq10_limit.toFixed(1);
				alert_delay = d.alert_delay;

				document.getElementById("laf").value = LAFlimit;
				document.getElementById("laeq1").value = LAEQ1limit;
				document.getElementById("laeq10").value = LAEQ10limit;
				document.getElementById("alert_delay").value = alert_delay;
			} catch (err) {
				console.error("Error in get_old_limits:", err);
			}
		}

		function changed() {
			let chg = 0;
			let err = 0;

			function checkField(limit, id, statusId) {
				const val = document.getElementById(id).value;
				const status = document.getElementById(statusId);

				if (parseFloat(limit) != parseFloat(val)) {
					chg++;
					status.innerText = "Old value was " + limit;
				} else {
					status.innerText = "";
				}

				if (isNaN(val)) {
					err++;
					status.innerText = "Must be a number!";
				}
			}

			checkField(LAFlimit, "laf", "statuslaf");
			checkField(LAEQ1limit, "laeq1", "status-laeq1");
			checkField(LAEQ10limit, "laeq10", "status-laeq10");
			checkField(alert_delay, "alert_delay", "status-alert_delay");

			if (parseFloat(document.getElementById("alert_delay").value) < 2) document.getElementById("alert_delay").value = 2;
			if (parseFloat(document.getElementById("alert_delay").value) > 20) document.getElementById("alert_delay").value = 20;

			const saveBtn = document.getElementById("SaveBtn");
			saveBtn.disabled = !(chg > 0 && err === 0);

			saved = chg === 0;
		}

		function setButtonsDisabled(disabled) {
			["SaveBtn", "ReturnBtn"].forEach(id => {
				document.getElementById(id).disabled = disabled;
			});
		}

		async function GotoMain() {
			if (saved) {
				window.location.href = "/";
			} else {
				const txt = "<h1>⚠️Limits changed</h1>You are about to leave without saving?</br></br>";
				const answ = await showModal(`<p>${txt}</p>`, [
					{ text: "Discard and goto main page", value: false },
					{ text: "Cancel", value: true }
				], "#aa0000", "#ffffff");

				if (answ !== true) {
					window.location.href = "/";
				}
			}
		}

		async function SaveLimits() {
			try {
				const r = await fetch('/limits', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						LAF_limit: parseFloat(document.getElementById("laf").value),
						LAeq1_limit: parseFloat(document.getElementById("laeq1").value),
						LAeq10_limit: parseFloat(document.getElementById("laeq10").value),
						alert_delay: parseFloat(document.getElementById("alert_delay").value)
					})
				});
				if (!r.ok) throw new Error(`POST failed: ${r.status}`);
				await get_old_limits();
				saved = true;
			} catch (err) {
				console.error("Error in SaveLimits:", err);
			}
		}

		async function restart() {
			try {
				const answ = await customConfirm("<h1>🙊 Restart HushMonkey?</h1>", "#aa0000", "#ffffff");
				if (answ === true) {
					const res = await fetch('/restart');
					if (!res.ok) throw new Error(`GET failed: ${res.status}`);
					const d = await res.json();
					console.log("Restart return: " + d.status);
					window.location.href = "/restart.html";
				}
			} catch (err) {
				console.error("Error in restart:", err);
			}
		}

		async function reboot() {
			try {
				const answ = await customConfirm("<h1>🙈 Reboot system?</h1>", "#aa0000", "#ffffff");
				if (answ === true) {
					const res = await fetch('/reboot');
					if (!res.ok) throw new Error(`GET failed: ${res.status}`);
					const d = await res.json();
					console.log("Reboot return: " + d.status);
					window.location.href = "/reboot.html";
				}
			} catch (err) {
				console.error("Error in reboot:", err);
			}
		}

		async function shutdown() {
			try {
				const answ = await customConfirm("<h1>🦍 Shutdown system?</h1>", "#aa0000", "#ffffff");
				if (answ === true) {
					const res = await fetch('/shutdown');
					if (!res.ok) throw new Error(`GET failed: ${res.status}`);
					const d = await res.json();
					console.log("Shutdown return: " + d.status);
					window.location.href = "/shutdown.html";
				}
			} catch (err) {
				console.error("Error in shutdown:", err);
			}
		}

	get_old_limits();
	setInterval(changed, 100);
	</script>

	</body>
</html>
